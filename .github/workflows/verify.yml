name: Verify
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm --prefix api ci
      - run: npm --prefix web ci
      - run: npm run verify
      - run: npm run build
      - name: Start development servers without a TTY
        env:
          DB_FILE: ":memory:"
          PORT: 13000
          WEB_PORT: 15173
        run: |
          timeout --kill-after=5s 35s npm run dev </dev/null &
          runner=$!
          trap 'kill "$runner" 2>/dev/null || true; wait "$runner" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused --max-time 2 http://127.0.0.1:15173/api/health | grep -F '"status":"ok"'
      - run: docker compose config -q
      - run: docker compose up -d --build --wait
      - run: |
          curl --fail --silent http://127.0.0.1:8080/api/health
          curl --fail --silent http://127.0.0.1:8080/api/overview | grep -F '"habits":[]'
          curl --fail --silent http://127.0.0.1:8080/ | grep -F '<title>HabitHub'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
